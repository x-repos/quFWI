[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "qufwi"
version = "0.1.0"
description = "Hybrid quantum-classical Full Waveform Inversion using FBPINNs with JAX"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ben", email = "sipkaro@gmail.com" },
]
dependencies = [
    "jax[cuda12]>=0.8",
    "numpy>=2.0",
    "optax>=0.2",
    "scipy>=1.14",
    "matplotlib>=3.10",
    "tensorboardX>=2.6",
    "pillow>=11.0",
]

[tool.uv.sources]
jax-cuda12-plugin = [
    { index = "jax-cuda12" },
]
jax-cuda12-pjrt = [
    { index = "jax-cuda12" },
]

[[tool.uv.index]]
name = "jax-cuda12"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
explicit = true

[tool.setuptools.packages.find]
include = ["fbpinns*", "pqcs*", "pennylane*"]
